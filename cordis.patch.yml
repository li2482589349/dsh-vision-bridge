# package root export). Config defaults: families=[deepseek], mode=auto,
# engine auto-discovered (any pi-ai route declaring image input), or pin with
# row config in the deployment's own cordis.patch.yml.
- insert:
    - id: vision-bridge
      name: '@jm2482589349/dsh-vision-bridge'
